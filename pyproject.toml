[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trav-llm"
version = "0.1.0"
description = "Sandbox to programmatically test out models, prompts, etc."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Define your dependencies here
dependencies = [
    # Example: "requests>=2.28.0",
    # Example: "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.0.250",
]

[project.urls]
Homepage = "https://github.com/yourusername/trav_llm_sandbox"
Repository = "https://github.com/yourusername/trav_llm_sandbox"

[tool.setuptools.packages.find]
where = ["src"]
